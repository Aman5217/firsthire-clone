<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMatch AI - Frontend Developer Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🚀 FirstHire Clone - JobMatch AI</div>
        <div class="user-profile">Aman Kumar Raj (Candidate)</div>
    </header>

    <main>
        <section class="hero">
            <h1>Find Your Next Frontend Role</h1>
            <p>Explore curated tech positions matched with your profile.</p>
            <input type="text" id="search-jobs" placeholder="Search by role, skill, or tech stack...">
        </section>

        <section class="job-listings">
            <h2>Active Openings</h2>
            <div id="job-grid" class="job-grid">
                <!-- Dynamically populated job cards -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
